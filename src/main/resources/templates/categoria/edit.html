<!DOCTYPE html>
<html lang="es" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/_mainLayout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría</title>
    <link th:href="@{/css/styleIndex.css}" rel="stylesheet" />
</head>

<body>
    <div layout:fragment="content" class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="creative-card">
                    <h2 class="text-center h4 mb-4" style="font-weight: 600;">Editar Categoría</h2>
                    <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Nombre de la Categoría</label>
                            <input type="text" class="form-control" th:field="*{nombreCategoria}" id="categoryName"
                                placeholder="Escribe el nuevo nombre de la categoría" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/categoria}" type="button" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Regresar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
